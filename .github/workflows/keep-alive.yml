name: Keep Gema Studio Alive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Check database health
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 3 \
            --retry-delay 10 \
            --max-time 45 \
            https://gemaestudiodebelleza.es/api/health

      - name: Check public website
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 3 \
            --retry-delay 10 \
            --max-time 45 \
            https://gemaestudiodebelleza.es/ > /dev/null

      - name: Monitor completed
        run: echo "Web y base de datos operativas"
